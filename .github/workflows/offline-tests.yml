# Offline test lane (P00-T05).
#
# This runs the tests that need neither the Path of Building runtime nor a
# provider credential. It deliberately does NOT provide a PoB checkout, so the
# `engine` tests report explicit skips. A green run here is evidence about the
# offline foundation only; it is never evidence that an engine gate passed.
#
# There is no engine lane. See "Engine lane" in the job summary below.

name: offline-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The PoB submodule is deliberately NOT checked out: this lane must
          # prove that the offline suite stands on its own.
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ./pob2-mcp -e ./pob2-optimizer

      - name: Environment diagnostics
        shell: bash
        # doctor exits 3 when the engine is absent, which is the expected state
        # here. Any other non-zero exit is a real failure.
        run: |
          set +e
          python -m pob2opt.cli doctor --json > doctor.json
          code=$?
          cat doctor.json
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi

      - name: Offline unit tests
        run: python -m pytest tests/unit -ra

      - name: Local integration tests
        # luajit is not installed on the runner, so these skip with a reason.
        run: python -m pytest tests/integration -ra

      - name: Engine tests must skip, not silently vanish
        shell: bash
        run: |
          python -m pytest -m engine -ra > engine.txt 2>&1 || true
          cat engine.txt
          if ! grep -q "no usable PathOfBuilding-PoE2 runtime" engine.txt; then
            echo "engine tests did not report the expected skip reason"
            exit 1
          fi
          if grep -qE "[0-9]+ (passed|failed)" engine.txt; then
            echo "engine tests ran without a runtime; the skip guard is broken"
            exit 1
          fi
          if ! grep -qE "[0-9]+ skipped" engine.txt; then
            echo "no engine test was collected at all"
            exit 1
          fi
          echo "engine tests skipped with a reason, as expected without a PoB checkout"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-diagnostics
          path: |
            doctor.json
            engine.txt
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Offline lane"
            echo
            echo "Covered: tests/unit, tests/integration, and the doctor diagnostics."
            echo
            echo "### Engine lane"
            echo
            echo "**Not provisioned.** The engine tests need a PathOfBuilding-PoE2"
            echo "checkout with its own patched LuaJIT runtime (runtime/lua51.dll),"
            echo "which this repository does not redistribute and which a hosted"
            echo "runner has no licensed, pinned copy of. Until a reviewer approves a"
            echo "provisioning route, engine evidence is produced on a Windows machine"
            echo "with POB2_ROOT set, and attached to the task worklog:"
            echo
            echo '```'
            echo 'set POB2_ROOT=C:\path\to\PathOfBuilding-PoE2'
            echo 'python -m pytest -m engine -ra'
            echo '```'
            echo
            echo "A skipped engine test is not an engine pass. No gate that requires"
            echo "real engine behaviour may be accepted on this lane alone."
            echo
            echo "### Live provider tests"
            echo
            echo "Opt-in only, never run here. Nothing in this lane holds a credential."
          } >> "$GITHUB_STEP_SUMMARY"
