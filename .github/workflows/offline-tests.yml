# Offline test lane (P00-T05, corrected for G0-R01 and G0-R02).
#
# Runs the tests that need neither the Path of Building runtime nor a provider
# credential, on every supported interpreter. It deliberately does NOT provide a
# PoB checkout, so the `engine` tests skip. A green run here is evidence about
# the offline foundation only; it is never evidence that an engine gate passed.
#
# There is no engine lane. See "Engine lane" in the job summary below.

name: offline-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Both packages declare requires-python >= 3.10 and architecture.md
        # retains 3.10, so 3.10 is exercised, not merely claimed. 3.12 is the
        # interpreter the P00 evidence was produced on.
        python-version: ['3.10', '3.12']
    name: offline (py${{ matrix.python-version }})
    env:
      LOCK: requirements/lock-py${{ matrix.python-version == '3.10' && '310' || '312' }}-win_amd64.txt
    steps:
      - uses: actions/checkout@v4
        with:
          # The PoB submodule is deliberately NOT checked out: this lane must
          # prove that the offline suite stands on its own.
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Reproduce the lock in two clean environments
        shell: bash
        run: |
          for suffix in a b; do
            python -m venv ".venv-ci-$suffix"
            py=".venv-ci-$suffix/Scripts/python.exe"
            "$py" -m pip install --upgrade pip setuptools wheel
            "$py" -m pip install --no-deps -r "$LOCK"
            "$py" -m pip install --no-deps --no-build-isolation -e ./pob2-mcp -e ./pob2-optimizer
            "$py" scripts/lock_dependencies.py --check --inventory "inventory-$suffix.json"
          done
          cmp inventory-a.json inventory-b.json
          python -c "from pathlib import Path; print(Path('.venv-ci-a/Scripts').resolve())" >> "$GITHUB_PATH"

      - name: Environment diagnostics
        shell: bash
        # doctor exits 3 when the engine is absent, which is the expected state
        # here. Any other non-zero exit is a real failure.
        run: |
          set +e
          python -m pob2opt.cli doctor --json > doctor.json
          code=$?
          cat doctor.json
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi

      - name: Persisted schemas match the record dataclasses
        # pob2opt/schemas/v1 is generated from pob2opt/domain/records.py
        # (P01-T01). A field added without regenerating would validate here
        # and fail wherever the record is actually persisted.
        run: python scripts/generate_schemas.py --check

      - name: Offline unit tests
        run: python -m pytest tests/unit -ra --junitxml=unit-junit.xml

      - name: Local integration tests
        # luajit is not installed on the runner, so these skip with a reason.
        run: python -m pytest tests/integration -ra --junitxml=integration-junit.xml

      - name: Engine tests must skip, not silently vanish
        shell: bash
        # The guard reads the JUnit report and the exit code. Reading the console
        # summary and discarding the exit status let a fixture error through:
        # `34 skipped, 1 error` with exit 1 satisfied every earlier condition.
        run: |
          set +e
          python -m pytest -m engine -ra --junitxml=engine-junit.xml
          code=$?
          set -e
          python scripts/check_engine_skips.py --exit-code "$code" --junit engine-junit.xml

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-diagnostics-py${{ matrix.python-version }}
          path: |
            doctor.json
            unit-junit.xml
            integration-junit.xml
            engine-junit.xml
            inventory-a.json
            inventory-b.json
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Offline lane (Python ${{ matrix.python-version }})"
            echo
            echo "Covered: a clean install from \`$LOCK\`, \`pip check\`, the doctor"
            echo "diagnostics, the generated-schema freshness check, tests/unit"
            echo "and tests/integration."
            echo
            echo "### Engine lane"
            echo
            echo "**Not provisioned.** The engine tests need a PathOfBuilding-PoE2"
            echo "checkout with its own patched LuaJIT runtime (runtime/lua51.dll),"
            echo "which this repository does not redistribute and which a hosted"
            echo "runner has no licensed, pinned copy of. Until a reviewer approves a"
            echo "provisioning route, engine evidence is produced on a Windows machine"
            echo "with POB2_ROOT set, and attached to the task worklog:"
            echo
            echo '```'
            echo 'set POB2_ROOT=C:\path\to\PathOfBuilding-PoE2'
            echo 'python -m pytest -m engine -ra'
            echo '```'
            echo
            echo "A skipped engine test is not an engine pass. No gate that requires"
            echo "real engine behaviour may be accepted on this lane alone."
            echo
            echo "### Live provider tests"
            echo
            echo "Opt-in only, never run here. Nothing in this lane holds a credential."
          } >> "$GITHUB_STEP_SUMMARY"
