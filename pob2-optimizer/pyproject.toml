[project]
name = "pob2-optimizer"
version = "0.1.0"
description = "Exhaustive Path of Building 2 build-space optimizer: skills, combos, summoners, multi-entity DPS, trade items"
requires-python = ">=3.10"
# jsonschema validates every persisted record (architecture.md, P01-T01).
# It is a runtime dependency, not a test-only one: pob2opt.domain.schemas
# imports it. Exact versions are pinned per interpreter in requirements/.
dependencies = ["requests>=2.31", "jsonschema>=4.21"]

[project.scripts]
pob2opt = "pob2opt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pob2opt", "pob2opt.catalog", "pob2opt.domain",
            "pob2opt.evaluation", "pob2opt.evaluation.legality",
            "pob2opt.sources", "pob2opt.storage"]

[tool.setuptools.package-data]
# schemas/v1 ships with the package so a record can be validated from an
# installed wheel, not only from a source checkout.
pob2opt = ["lua/*.lua", "schemas/v1/*.json", "catalog/fixtures/*.json"]
