[project]
name = "pob2-optimizer"
version = "0.1.0"
description = "Exhaustive Path of Building 2 build-space optimizer: skills, combos, summoners, multi-entity DPS, trade items"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
pob2opt = "pob2opt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pob2opt"]

[tool.setuptools.package-data]
pob2opt = ["lua/*.lua"]
