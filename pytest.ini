[pytest]
# P00-T02. Offline tests are the default; anything that needs a network provider
# or minutes of wall time must be requested explicitly with its own -m selector.
testpaths = tests
norecursedirs = external runs .git
addopts = -ra --strict-markers --import-mode=importlib -m "not network and not longrun"
markers =
    engine: requires a usable PathOfBuilding-PoE2 checkout and its LuaJIT runtime.
    network: contacts an external provider; never selected by default.
    longrun: takes minutes or more; never selected by default.
# `engine` stays selected by default on purpose: when the runtime is absent the
# tests must report an explicit skip reason, not disappear from the report.
